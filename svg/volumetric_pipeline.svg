<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1300" font-family="sans-serif">

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="820" height="1300" fill="white"/>

  <!-- ═══════════════════════════════════════════════════ TITLE -->
  <text x="400" y="32" text-anchor="middle"
        font-size="15" font-weight="bold" fill="#111827">
    Volumetric DINOv3 Inference Pipeline
  </text>

  <!-- ═══════════════════════════════════════════════════ 1. MRI Volume -->
  <!-- box: x=250, y=48, w=300, h=52 -->
  <rect x="250" y="48" width="300" height="52" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="69" text-anchor="middle"
        font-size="13" font-weight="bold" fill="#374151">MRI Volume</text>
  <text x="400" y="88" text-anchor="middle"
        font-size="11" fill="#6b7280">[B, 1, 160, 224, 224]</text>

  <!-- arrow 1→2 -->
  <line x1="400" y1="100" x2="400" y2="128"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="412" y="117" font-size="10" fill="#6b7280">slices 60–99</text>

  <!-- ═══════════════════════════════════════════════════ 2. Center Crop output -->
  <rect x="270" y="132" width="260" height="42" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="149" text-anchor="middle"
        font-size="11" font-weight="bold" fill="#374151">Center Crop</text>
  <text x="400" y="165" text-anchor="middle"
        font-size="11" fill="#6b7280">[B, 1, 40, 224, 224]</text>

  <!-- arrow 2→3 -->
  <line x1="400" y1="174" x2="400" y2="202"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="412" y="191" font-size="10" fill="#6b7280">unbatch &amp; expand channels</text>

  <!-- ═══════════════════════════════════════════════════ 3. Slice Unbatching output -->
  <rect x="270" y="206" width="260" height="42" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="223" text-anchor="middle"
        font-size="11" font-weight="bold" fill="#374151">Slice Unbatching</text>
  <text x="400" y="239" text-anchor="middle"
        font-size="11" fill="#6b7280">[B*40, 3, 224, 224]</text>

  <!-- arrow 3→4 -->
  <line x1="400" y1="248" x2="400" y2="274"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════════════════════════════════════ 4. DINOv3 Backbone (frozen) -->
  <rect x="220" y="278" width="360" height="78" rx="8"
        fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="400" y="302" text-anchor="middle"
        font-size="13" font-weight="bold" fill="#1e40af">DINOv3 Backbone (ViT-B/16)</text>
  <text x="400" y="320" text-anchor="middle"
        font-size="11" fill="#3b82f6">patch size 16×16 · d_model 768</text>
  <text x="400" y="338" text-anchor="middle"
        font-size="11" fill="#1e40af">🔒 frozen</text>

  <!-- Hook annotation box -->
  <rect x="596" y="283" width="195" height="64" rx="6"
        fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="693" y="300" text-anchor="middle"
        font-size="9.5" font-weight="bold" fill="#1e40af">hook on blocks[-1].attn</text>
  <text x="693" y="315" text-anchor="middle"
        font-size="9" fill="#3b82f6">inputs[0][:, 5:, :]</text>
  <text x="693" y="328" text-anchor="middle"
        font-size="9" fill="#3b82f6">skip CLS(1) + registers(4)</text>
  <text x="693" y="341" text-anchor="middle"
        font-size="9" fill="#3b82f6">→ patch tokens</text>
  <!-- dashed connector -->
  <line x1="580" y1="317" x2="596" y2="317"
        stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- arrow 4→5 -->
  <line x1="400" y1="356" x2="400" y2="382"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="412" y="372" font-size="10" fill="#6b7280">hook → patch tokens</text>

  <!-- ═══════════════════════════════════════════════════ 5. Patch tokens -->
  <rect x="270" y="386" width="260" height="42" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="403" text-anchor="middle"
        font-size="11" font-weight="bold" fill="#374151">Patch Tokens</text>
  <text x="400" y="419" text-anchor="middle"
        font-size="11" fill="#6b7280">[B*40, 196, 768]</text>

  <!-- arrow 5→6 -->
  <line x1="400" y1="428" x2="400" y2="454"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="412" y="444" font-size="10" fill="#6b7280">flatten depth × patches</text>

  <!-- ═══════════════════════════════════════════════════ 6. Reshape output -->
  <rect x="270" y="458" width="260" height="42" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="475" text-anchor="middle"
        font-size="11" font-weight="bold" fill="#374151">Reshape</text>
  <text x="400" y="491" text-anchor="middle"
        font-size="11" fill="#6b7280">[B, 7840, 768]</text>

  <!-- arrow 6→7 -->
  <line x1="400" y1="500" x2="400" y2="524"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════════════════════════════════════ 7. Depth Encoding -->
  <rect x="210" y="528" width="380" height="62" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="550" text-anchor="middle"
        font-size="13" font-weight="bold" fill="#374151">Depth Positional Encoding</text>
  <text x="400" y="567" text-anchor="middle"
        font-size="10" fill="#6b7280">sinusoidal · depth 60–99 only · broadcast across 196 patches</text>
  <text x="400" y="582" text-anchor="middle"
        font-size="10" fill="#6b7280">x = x + depth_enc  (row/col already in token values)</text>

  <!-- arrow 7→8 -->
  <line x1="400" y1="590" x2="400" y2="614"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════════════════════════════════════ 8. After RoPE tensor -->
  <rect x="270" y="618" width="260" height="42" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="635" text-anchor="middle"
        font-size="11" font-weight="bold" fill="#374151">Depth-encoded sequence</text>
  <text x="400" y="651" text-anchor="middle"
        font-size="11" fill="#6b7280">[B, 7840, 768]</text>

  <!-- arrow 8→9 -->
  <line x1="400" y1="660" x2="400" y2="684"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════════════════════════════════════ 9. 4× Frozen blocks -->
  <rect x="220" y="688" width="360" height="78" rx="8"
        fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="400" y="712" text-anchor="middle"
        font-size="13" font-weight="bold" fill="#1e40af">4× Frozen DINOv3 Blocks</text>
  <text x="400" y="730" text-anchor="middle"
        font-size="11" fill="#3b82f6">blocks 8 → 9 → 10 → 11</text>
  <text x="400" y="748" text-anchor="middle"
        font-size="11" fill="#1e40af">🔒 frozen</text>

  <!-- arrow 9→10 -->
  <line x1="400" y1="766" x2="400" y2="790"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════════════════════════════════════ 10. After blocks tensor -->
  <rect x="270" y="794" width="260" height="42" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="811" text-anchor="middle"
        font-size="11" font-weight="bold" fill="#374151">Block output</text>
  <text x="400" y="827" text-anchor="middle"
        font-size="11" fill="#6b7280">[B, 7840, 768]</text>

  <!-- arrow 10→11 -->
  <line x1="400" y1="836" x2="400" y2="860"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════════════════════════════════════ 11. LayerNorm (frozen) -->
  <rect x="300" y="864" width="200" height="52" rx="8"
        fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="400" y="886" text-anchor="middle"
        font-size="13" font-weight="bold" fill="#1e40af">LayerNorm</text>
  <text x="400" y="904" text-anchor="middle"
        font-size="11" fill="#1e40af">🔒 frozen</text>

  <!-- arrow 11→12 -->
  <line x1="400" y1="916" x2="400" y2="940"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════════════════════════════════════ 12. Max Pooling -->
  <rect x="195" y="944" width="410" height="68" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="400" y="968" text-anchor="middle"
        font-size="13" font-weight="bold" fill="#374151">Max Pooling</text>
  <text x="400" y="986" text-anchor="middle"
        font-size="10" fill="#6b7280">x.max(dim=1)  →  most extreme activation per feature</text>
  <text x="400" y="1002" text-anchor="middle"
        font-size="10" fill="#6b7280">captures worst-affected region · no parameters</text>

  <!-- arrow 12→13 -->
  <line x1="400" y1="1012" x2="400" y2="1036"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════════════════════════════════════ 13. Output -->
  <rect x="220" y="1040" width="360" height="60" rx="8"
        fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="400" y="1062" text-anchor="middle"
        font-size="13" font-weight="bold" fill="#374151">Patient Feature Vector</text>
  <text x="400" y="1079" text-anchor="middle"
        font-size="11" fill="#6b7280">[B, 768]</text>
  <text x="400" y="1093" text-anchor="middle"
        font-size="10" fill="#9ca3af">→  features_{side}.npz  (ids [N], features [N, 768])</text>

  <!-- ═══════════════════════════════════════════════════ LEGEND -->
  <rect x="564" y="1130" width="230" height="94" rx="8"
        fill="white" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="679" y="1150" text-anchor="middle"
        font-size="12" font-weight="bold" fill="#374151">Legend</text>

  <!-- Frozen -->
  <rect x="578" y="1160" width="18" height="14" rx="3"
        fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="604" y="1172" font-size="11" fill="#374151">🔒  Frozen component</text>

  <!-- Tensor -->
  <rect x="578" y="1184" width="18" height="14" rx="3"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="604" y="1196" font-size="11" fill="#374151">Tensor / data flow</text>

</svg>
