<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1020" font-family="sans-serif">

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect width="820" height="1020" fill="white"/>

  <!-- ═══════════════════════════════════════ TITLE -->
  <text x="410" y="32" text-anchor="middle"
        font-size="15" font-weight="bold" fill="#111827">
    Downstream Pipeline — Clustering &amp; Scoring
  </text>

  <!-- ═══════════════════════════════════════ 1. Feature matrix input -->
  <rect x="250" y="50" width="320" height="58" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="410" y="73" text-anchor="middle"
        font-size="13" font-weight="bold" fill="#374151">Feature Matrix</text>
  <text x="410" y="90" text-anchor="middle"
        font-size="11" fill="#6b7280">features_{side}.npz</text>
  <text x="410" y="103" text-anchor="middle"
        font-size="10" fill="#9ca3af">ids [N]  ·  features [N, 768]</text>

  <!-- arrow 1→2 -->
  <line x1="410" y1="108" x2="410" y2="134"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════════════════════════ 2. K-means -->
  <rect x="220" y="138" width="380" height="72" rx="8"
        fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <text x="410" y="162" text-anchor="middle"
        font-size="13" font-weight="bold" fill="#713f12">K-Means Clustering</text>
  <text x="410" y="180" text-anchor="middle"
        font-size="10" fill="#854d0e">k=5  ·  random_state=42  ·  n_init=10</text>
  <text x="410" y="197" text-anchor="middle"
        font-size="10" fill="#854d0e">groups patients by similarity of [768] feature vectors</text>

  <!-- annotation: what "similar" means -->
  <rect x="614" y="143" width="185" height="58" rx="6"
        fill="#fefce8" stroke="#fde047" stroke-width="1"/>
  <text x="706" y="160" text-anchor="middle"
        font-size="9" font-weight="bold" fill="#713f12">Similarity = Euclidean</text>
  <text x="706" y="174" text-anchor="middle"
        font-size="9" fill="#854d0e">distance in 768-dim space</text>
  <text x="706" y="187" text-anchor="middle"
        font-size="9" fill="#854d0e">between max-pooled vectors</text>
  <line x1="600" y1="172" x2="614" y2="172"
        stroke="#fde047" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- arrow 2→3 -->
  <line x1="410" y1="210" x2="410" y2="236"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════════════════════════ 3. Cluster assignments -->
  <rect x="270" y="240" width="280" height="52" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="410" y="260" text-anchor="middle"
        font-size="11" font-weight="bold" fill="#374151">Cluster Assignments</text>
  <text x="410" y="276" text-anchor="middle"
        font-size="11" fill="#6b7280">mri_clusters_{side}.csv</text>
  <text x="410" y="288" text-anchor="middle"
        font-size="10" fill="#9ca3af">columns: ID · cluster (0…k-1)</text>

  <!-- arrow 3→4 (left branch to MOAKS) -->
  <line x1="410" y1="292" x2="410" y2="326"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="422" y="313" font-size="10" fill="#6b7280">left join on ID</text>

  <!-- MOAKS CSV input (comes from the side) -->
  <rect x="596" y="310" width="185" height="52" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="688" y="330" text-anchor="middle"
        font-size="11" font-weight="bold" fill="#374151">MOAKS CSV</text>
  <text x="688" y="347" text-anchor="middle"
        font-size="10" fill="#6b7280">MOAK_L.csv / MOAK_R.csv</text>
  <text x="688" y="360" text-anchor="middle"
        font-size="10" fill="#9ca3af">ID · cartilage · BML · osteophyte …</text>
  <!-- connector from MOAKS CSV into scoring box -->
  <line x1="596" y1="336" x2="570" y2="370"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════════════════════════ 4. MOAKS scoring -->
  <rect x="220" y="330" width="380" height="78" rx="8"
        fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <text x="410" y="354" text-anchor="middle"
        font-size="13" font-weight="bold" fill="#713f12">MOAKS Scoring</text>
  <text x="410" y="372" text-anchor="middle"
        font-size="10" fill="#854d0e">merge cluster assignments ← MOAKS CSV on patient ID</text>
  <text x="410" y="388" text-anchor="middle"
        font-size="10" fill="#854d0e">compute mean score per variable per cluster</text>
  <text x="410" y="402" text-anchor="middle"
        font-size="10" fill="#854d0e">report n_total · n_with_moaks per cluster</text>

  <!-- arrow 4→5 -->
  <line x1="410" y1="408" x2="410" y2="434"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════════════════════════ 5. MOAKS stats output -->
  <rect x="240" y="438" width="340" height="62" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="410" y="458" text-anchor="middle"
        font-size="11" font-weight="bold" fill="#374151">Per-Cluster MOAKS Statistics</text>
  <text x="410" y="474" text-anchor="middle"
        font-size="10" fill="#6b7280">moaks_cluster_stats_{side}.csv</text>
  <text x="410" y="488" text-anchor="middle"
        font-size="10" fill="#9ca3af">cluster · n_total · n_with_moaks · &lt;var&gt;_mean …</text>

  <!-- ═══════════════════════════════════════ SEPARATOR -->
  <line x1="60" y1="522" x2="760" y2="522"
        stroke="#e5e7eb" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="410" y="518" text-anchor="middle"
        font-size="9" fill="#9ca3af">t-SNE visualisation (requires N &gt; perplexity, default 30)</text>

  <!-- arrow 5→6 (from cluster assignments down to t-SNE) -->
  <line x1="310" y1="500" x2="310" y2="538"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="510" y1="500" x2="510" y2="538"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <!-- labels on the two inputs -->
  <text x="252" y="524" font-size="9" fill="#9ca3af">features</text>
  <text x="516" y="524" font-size="9" fill="#9ca3af">cluster labels</text>

  <!-- ═══════════════════════════════════════ 6. t-SNE -->
  <rect x="220" y="542" width="380" height="72" rx="8"
        fill="#fef9c3" stroke="#fde047" stroke-width="1.5"/>
  <text x="410" y="566" text-anchor="middle"
        font-size="13" font-weight="bold" fill="#713f12">t-SNE</text>
  <text x="410" y="584" text-anchor="middle"
        font-size="10" fill="#854d0e">reduce [N, 768] → [N, 2] (or 1D / 3D)</text>
  <text x="410" y="600" text-anchor="middle"
        font-size="10" fill="#854d0e">colour each point by cluster assignment</text>

  <!-- arrow 6→7 -->
  <line x1="410" y1="614" x2="410" y2="640"
        stroke="#374151" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- ═══════════════════════════════════════ 7. t-SNE plot output -->
  <rect x="255" y="644" width="310" height="52" rx="8"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="410" y="664" text-anchor="middle"
        font-size="11" font-weight="bold" fill="#374151">t-SNE Plot</text>
  <text x="410" y="680" text-anchor="middle"
        font-size="10" fill="#6b7280">tsne_{side}_{n}d.png</text>
  <text x="410" y="692" text-anchor="middle"
        font-size="10" fill="#9ca3af">scatter coloured by cluster · saved to plots/</text>

  <!-- ═══════════════════════════════════════ DATA FLOW OVERVIEW BOX -->
  <rect x="40" y="740" width="740" height="220" rx="10"
        fill="#f9fafb" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="410" y="762" text-anchor="middle"
        font-size="12" font-weight="bold" fill="#374151">Output Files Summary</text>

  <!-- col 1 -->
  <text x="80" y="788" font-size="11" font-weight="bold" fill="#374151">File</text>
  <text x="80" y="808" font-size="10" fill="#6b7280">features_{side}.npz</text>
  <text x="80" y="826" font-size="10" fill="#6b7280">mri_clusters_{side}.csv</text>
  <text x="80" y="844" font-size="10" fill="#6b7280">moaks_cluster_stats_{side}.csv</text>
  <text x="80" y="862" font-size="10" fill="#6b7280">tsne_{side}_{n}d.png</text>

  <!-- col 2 -->
  <text x="330" y="788" font-size="11" font-weight="bold" fill="#374151">Contents</text>
  <text x="330" y="808" font-size="10" fill="#6b7280">ids [N], features [N, 768]</text>
  <text x="330" y="826" font-size="10" fill="#6b7280">ID, cluster (0…k-1)</text>
  <text x="330" y="844" font-size="10" fill="#6b7280">cluster, n_total, n_with_moaks, &lt;var&gt;_mean</text>
  <text x="330" y="862" font-size="10" fill="#6b7280">2-D scatter coloured by cluster</text>

  <!-- col 3 -->
  <text x="620" y="788" font-size="11" font-weight="bold" fill="#374151">Location</text>
  <text x="620" y="808" font-size="10" fill="#6b7280">results/{side}/features/</text>
  <text x="620" y="826" font-size="10" fill="#6b7280">results/{side}/csv/</text>
  <text x="620" y="844" font-size="10" fill="#6b7280">results/{side}/csv/</text>
  <text x="620" y="862" font-size="10" fill="#6b7280">results/{side}/plots/</text>

  <!-- divider lines -->
  <line x1="60" y1="793" x2="760" y2="793" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="320" y1="775" x2="320" y2="875" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="610" y1="775" x2="610" y2="875" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ═══════════════════════════════════════ LEGEND -->
  <rect x="564" y="892" width="216" height="94" rx="8"
        fill="white" stroke="#d1d5db" stroke-width="1.2"/>
  <text x="672" y="912" text-anchor="middle"
        font-size="12" font-weight="bold" fill="#374151">Legend</text>

  <rect x="578" y="922" width="18" height="14" rx="3"
        fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
  <text x="604" y="934" font-size="11" fill="#374151">Processing step</text>

  <rect x="578" y="946" width="18" height="14" rx="3"
        fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="604" y="958" font-size="11" fill="#374151">Data / file artifact</text>

</svg>
